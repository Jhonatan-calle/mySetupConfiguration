# vim:ft=kitty

## name: Atelier Sulphurpool Light
## author: Bram de Haan (https://github.com/atelierbram)
## license: MIT
## blurb: Purple-ish otherworldly colorscheme - Light variant


#: The basic colors

foreground #1b1b2f
background #fefef8
selection_foreground #1b1b2f
selection_background #cccccc


#: Cursor colors

cursor #1b1b2f
cursor_text_color #fefef8


#: URL underline color when hovering with mouse

url_color #0099ff


#: kitty window border colors and terminal bell colors

active_border_color #1b1b2f
inactive_border_color #fefef8
bell_border_color #d41f1f
visual_bell_color #d41f1f


#: OS Window titlebar colors

wayland_titlebar_color #fefef8
macos_titlebar_color #fefef8


#: Tab bar colors

active_tab_foreground #1b1b2f
active_tab_background #fefef8
inactive_tab_foreground #666666
inactive_tab_background #fefef8
tab_bar_background #fefef8
tab_bar_margin_color none


#: Colors for marks (marked text in the terminal)

mark1_foreground #fefef8
mark1_background #1b1b2f
mark2_foreground #fefef8
mark2_background #cc8800
mark3_foreground #fefef8
mark3_background #0099ff


#: The basic 16 colors

#: black
color0 #fefef8
color8 #999999

#: red
color1 #cc0000
color9 #ff3333

#: green
color2 #008800
color10 #33ff33

#: yellow
color3 #cc8800
color11 #ffcc33

#: blue
color4 #0099ff
color12 #3399ff

#: magenta
color5 #cc00cc
color13 #ff33ff

#: cyan
color6 #0099ff
color14 #33ffff

#: white
color7 #1b1b2f
color15 #1b1b2f
